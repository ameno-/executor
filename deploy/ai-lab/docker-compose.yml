# Self-hosted Executor on ai-lab. Loopback only; tailnet via `tailscale serve`.
#   docker compose up -d --build     (run from this directory)
# Secrets live in ~/.config/executor-selfhost/env (0600), data in
# ~/.local/share/executor-selfhost (0700). See README.md.
services:
  executor:
    build:
      context: ../..
      dockerfile: apps/host-selfhost/Dockerfile
    image: executor-selfhost:ai-lab
    container_name: executor-selfhost
    restart: unless-stopped
    # Bind-mounted data dir is owned by the host user, so run as that user
    # (the image default is 65532 and could not write to a 0700 host dir).
    user: "${EXECUTOR_UID:-1000}:${EXECUTOR_GID:-1000}"
    ports:
      - "127.0.0.1:4788:4788"
    # nasir-executor carries only this container and nasir-live's gateway (ameno-/nasir deploy/up.sh creates it,
    # labelled nasir.purpose=executor-gateway), so the Nasir MCP source reaches http://nasir-live-gateway-1:6580/mcp.
    # Calling a docker-network host also needs EXECUTOR_ALLOW_LOCAL_NETWORK=true in the env file.
    networks: [default, nasir-executor]
    env_file:
      - ${EXECUTOR_ENV_FILE:-${HOME}/.config/executor-selfhost/env}
    volumes:
      - ${EXECUTOR_DATA_HOST_DIR:-${HOME}/.local/share/executor-selfhost}:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4788/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  nasir-executor:
    external: true
